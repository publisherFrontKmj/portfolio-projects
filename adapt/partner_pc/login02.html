<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>협력사 지원사이트 - 로그인 2차</title>

    <link rel="stylesheet" type="text/css" href="https://publisherfrontkmj.github.io/portfolio-projects/hd_css/reset.css">
	<link rel="stylesheet" type="text/css" href="//img.ezwelfare.net/welfare_new/css/notokr_font.css">
    <link rel="stylesheet" type="text/css" href="https://publisherfrontkmj.github.io/portfolio-projects/hd_css/swiper.css">
    <link rel="stylesheet" type="text/css" href="https://publisherfrontkmj.github.io/portfolio-projects/hd_css/partner_pc.css">
</head>
<body>
    <div class="login_wrapper">
        <div class="wrap_inner">
            <div class="login_wrap">
                <div class="login_box2_02_close">
                    <a href="javascript:void(0);">
                        <img src="//img.ezwelfare.net/welfare_new/images/customer/partner/partner_login_close_icon.png" alt="">
                    </a>
                </div>
                <div class="login_box login_box_02 login_box2_02">
                    <div class="login2_text_box">
                        <p class="login2_tit">로그인 추가인증</p>
                        <p class="login2_subtit">안전한 사용을 위해 2차 인증을 진행해주세요.</p>
                    </div>
                    <div class="login_tel_line">
                        <input type="text" name="" id="" size="" class="login_tel_box" placeholder="휴대폰 번호를 입력하세요(“-”문자 제외)">
                        <a href="javascript:void(0);">인증번호 요청</a>
                    </div>
                    <div class="login_sms_tel_line">
                        <p>
                            <span class="login_sms_tel_line_text login_sms_tel_line_tit">SMS로 발송된 인증번호를 입력하세요.</span>
                            <span class="login_sms_tel_line_text login_sms_tel_line_time">
                                <span class="tel_time01">03</span>
                                :
                                <span class="tel_time02">00</span>
                            </span>
                        </p>
                    </div>
                    <input type="text" name="" id="" size="" class="login_tel_certification_box" placeholder="인증번호를 입력하세요">
                    <div class="login_certification_button">
                        <a href="javascript:void(0);">인증번호 확인</a>
                    </div>
                </div>
                <!-- //login_box_02 -->
            </div>
            <!-- //login_wrap -->
        </div>
        <!-- //wrap_inner -->
        <div class="login_footer">
            <p>COPYRIGHT (C) HYUNDAI EZWEL CO.,LTD. ALL RIGHT RESERVED.</p>
        </div>
        <!-- //login_footer -->
    </div>
    <!-- //login_wrapper -->

    <script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="https://publisherfrontkmj.github.io/portfolio-projects/hd_js/swiper.js"></script>
    <script type="text/javascript" src="https://publisherfrontkmj.github.io/portfolio-projects/hd_js/partner_pc.js"></script>
</body>
</html>
