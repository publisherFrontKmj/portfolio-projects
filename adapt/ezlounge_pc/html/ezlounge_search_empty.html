<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판/챌린지 - 검색결과X</title>

    <link rel="stylesheet" type="text/css" href="http://rlaalswo22.dothome.co.kr/hd_css/reset.css">
	<link rel="stylesheet" type="text/css" href="//img.ezwelfare.net/welfare_new/css/notokr_font.css">
    <link rel="stylesheet" type="text/css" href="http://rlaalswo22.dothome.co.kr/hd_css/swiper.css">

</head>
<body>
	<!-- ezlounge 헤더 -->
	<div class="ezlounge_header">
		<div class="ezlounge_inner">
			<h1 class="ezlounge_logo">
				<a href="javascript:void(0);"><img src="//img.ezwelfare.net/welfare_mall/ezlounge/ezlounge_logo.png" alt="ezlounge logo"></a>
				<span class="ezlounge_logo_txt">이지웰의 새로운 소식을 가장 빠르게! 업데이트</span>
			</h1>
		</div>
	</div>
	<!-- //ezlounge 헤더 -->	
	<!-- 241022 ezlounge contents -->
	<div class="ezlounge_zone">
		<div class="ezlounge_wrap">
			<div class="ezlounge_top ezlounge_inner">
				<div class="ezlounge_menu">
					<ul>
						<li class="on"><a href="javascript:void(0);">이지웰소식</a></li>
						<li><a href="javascript:void(0);">우리회사소식</a></li>
						<li><a href="javascript:void(0);">홍보게시판</a></li>
						<li>
							<span class="challenge_mark" style="display:blcok;">진행중</span>
							<a href="javascript:void(0);">챌린지</a>
						</li>
					</ul>
				</div>

				<div class="ezlounge_search">
					<input type="text" placeholder="검색어를 입력하세요.">
					<a href="javascript:void(0);" class="search_reset">검색 초기화</a>
					<a href="javascript:void(0);"><img src="//img.ezwelfare.net/welfare_mall/ezlounge/ezlounge_search_icon.png" alt="돋보기"></a>
				</div>
			</div>
			<!-- //ezlounge_top -->

			<div class="ezlounge_search_tab">
				<div class="ezlounge_inner">
					<p class="search_txt">‘공지사항’ <span>검색결과</span></p>
					<ul class="search_tab">
						<li class="on"><a href="javascript:void(0);">이지웰소식</a></li>
						<li><a href="javascript:void(0);">회사소식</a></li>
						<li><a href="javascript:void(0);">홍보게시판</a></li>
						<li><a href="javascript:void(0);">챌린지</a></li>
					</ul>
				</div>
			</div>
			<!-- //ezlounge_search_tab -->

			<div class="ezlounge_filter_top ezlounge_inner">
				<p class="top_t1"><span>0</span>건의 게시물이 있습니다.</p>
				<div class="filter_top">
					<ul>
						<li class="on"><a href="javascript:void(0);">최신순</a></li>
						<li><a href="javascript:void(0);">인기순</a></li>
						<li><a href="javascript:void(0);">조회순</a></li>
					</ul>
				</div>
			</div>
			<!-- //ezlounge_list_top -->

			<div class="ezlounge_inner">
				<p class="empty_txt">검색 결과가 없습니다.</p>
			</div>
			<!-- //ezlounge_inner -->
		</div>
		<!-- //ezlounge_wrap -->
	</div>

    <script type="text/javascript" src="http://rlaalswo22.dothome.co.kr/hd_js/jquery.js"></script>
