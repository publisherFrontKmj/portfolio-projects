<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>협력사 지원사이트 - 로그인</title>

    <!-- <link rel="stylesheet" type="text/css" href="https://publisherfrontkmj.github.io/portfolio-projects/hd_css/reset.css"> -->
	<link rel="stylesheet" type="text/css" href="//img.ezwelfare.net/welfare_new/css/notokr_font.css">
    <link rel="stylesheet" type="text/css" href="https://publisherfrontkmj.github.io/portfolio-projects/hd_css/swiper.css">
    <link rel="stylesheet" type="text/css" href="https://publisherfrontkmj.github.io/portfolio-projects/hd_css/partner_mo.css">
</head>
<body>
    <div class="login_wrapper">

        <div class="login_wrap">
            <div class="login_box login_box_01">
                <h1>
                    <a href="javascript:void(0);" class="login_logo">
                        <img src="//img.ezwelfare.net/welfare_new/images/customer/partner/partner_login_logo.png" alt="">
                        협력사 지원센터
                    </a>
                </h1>
                <p class="login_box_01_text">
                    협력사 어드민 계정으로 로그인이 가능합니다. <br>
                    등록된 어드민 계정으로 로그인 해주세요.
                </p>
            </div>
            <!-- //login_box_01 -->
            <div class="login_box login_box_02">
                <div class="login_select_box">
                    <h2>협력사 어드민 선택</h2>
                    <div class="login_select_top">
                        <span>사용중이신 어드민을 선택하세요</span>
                    </div>
                    <ul class="login_select">
                        <li class="login_select_list">
                            <a href="javascript:void(0);">
                                파트너 어드민 (컨텐츠/WOW숙박) <!-- 230203 텍스트 수정 -->
                            </a>
                        </li>
                        <li class="login_select_list">
                            <a href="javascript:void(0);">
                                Padmin (복지샵/브랜드몰)
                            </a>
                        </li>
                        <li class="login_select_list">
                            <a href="javascript:void(0);">
                                이지체크인 어드민
                            </a>
                        </li>
                        <li class="login_select_list">
                            <a href="javascript:void(0);">
                                마켓 어드민 (온누리 전통시장/B2B) 
                            </a>
                        </li>
                        <li class="login_select_list">
                            <a href="javascript:void(0);">
                                E쿠폰 어드민
                            </a>
                        </li>
                        <li class="login_select_list login_select_last_list">
                            <a href="javascript:void(0);">
                                시스템관리자
                            </a>
                        </li>
                    </ul>
                </div>
                <h2>계정정보 입력</h2>
                <input type="text" name="" id="" size="" class="login_text_box login_id_box" placeholder="아이디를 입력하세요">
                <input type="password" name="" id="" size="" class="login_text_box login_pw_box" placeholder="비밀번호를 입력하세요">
                <input type="checkbox" id="loginIdSave">
                <label for="loginIdSave" class="login_id_save">아이디 저장</label>
                <div class="login_button">
                    <a href="javascript:void(0);">로그인</a>
                </div>
                <div class="login_explanation"><!-- s: 230203 수정 -->
                    <p>※ 로그인 관련 문의 사항은 담당자(MD)에게 연락 바랍니다.</p>
                    <a href="javascript:void(0);">입점 안내</a>
                </div><!-- e: 230203 수정 -->
            </div>
            <!-- //login_box_02 -->
        </div>
        <!-- //login_wrap -->
    
    </div>
    <!-- //login_wrapper -->

    <script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="https://publisherfrontkmj.github.io/portfolio-projects/hd_js/swiper.js"></script>
    <script type="text/javascript" src="https://publisherfrontkmj.github.io/portfolio-projects/hd_js/partner_mo.js"></script>
</body>
</html>
